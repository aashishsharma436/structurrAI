name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify project Pages site
        run: |
          URL="https://aashishsharma436.github.io/structurrAI/"
          echo "Checking: $URL"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -L -s -o /tmp/project.html -w '%{http_code}' "$URL")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ] && grep -qi "StructurrAI" /tmp/project.html; then
              echo "Project Pages site is live."
              exit 0
            fi
            sleep 10
          done
          echo "Project Pages site did not return the deployed page."
          exit 1
