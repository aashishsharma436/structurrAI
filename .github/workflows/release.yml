name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify project Pages site and assets
        run: |
          URL="https://aashishsharma436.github.io/structurrAI/"
          echo "Checking: $URL"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -L -s -o /tmp/project.html -w '%{http_code}' "$URL")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ] && grep -qi "StructurrAI" /tmp/project.html; then
              echo "Project Pages HTML is live."
              break
            fi
            sleep 10
          done

          if ! grep -qi "StructurrAI" /tmp/project.html; then
            echo "Project Pages HTML verification failed."
            exit 1
          fi

          assets=$(grep -oE '(src|href)="(/structurrAI/[^"]+)"' /tmp/project.html | sed -E 's/^(src|href)="//;s/"$//' | sort -u)
          for asset in $assets; do
            asset_code=$(curl -L -s -o /dev/null -w '%{http_code}' "https://aashishsharma436.github.io$asset")
            echo "Asset $asset -> HTTP $asset_code"
            if [ "$asset_code" != "200" ]; then
              echo "Broken deployed asset: $asset"
              exit 1
            fi
          done

          echo "Project Pages HTML and referenced assets are live."


  release:
    name: Create GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          latest=$(git tag --list 'v*' --sort=-version:refname | head -n 1)

          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            version="${latest#v}"
            IFS='.' read -r major minor patch <<< "$version"
            patch=$((patch + 1))
            next="v$major.$minor.$patch"
          fi

          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" --target "${{ github.sha }}" --title "${{ steps.version.outputs.tag }}" --generate-notes
