name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Preserve recent hashed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/previous-pages /tmp/previous-site
          previous_runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=github-pages&per_page=20"             --jq '[.artifacts[] | select(.expired == false) | select(.workflow_run.id != '${{ github.run_id }}')] | sort_by(.created_at) | reverse | .[0:3][] | .workflow_run.id' || true)

          for run_id in $previous_runs; do
            echo "Trying previous Pages artifact from run $run_id"
            rm -rf /tmp/previous-pages/* /tmp/previous-site/*
            if gh run download "$run_id" -n github-pages -D /tmp/previous-pages >/dev/null 2>&1; then
              artifact_tar=$(find /tmp/previous-pages -name artifact.tar -print -quit)
              if [ -n "$artifact_tar" ]; then
                tar -xf "$artifact_tar" -C /tmp/previous-site
                if [ -d /tmp/previous-site/assets ]; then
                  cp -an /tmp/previous-site/assets/. dist/assets/
                  echo "Preserved assets from run $run_id"
                fi
              fi
            fi
          done

      - name: Create SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify project Pages site and assets
        run: |
          URL="https://aashishsharma436.github.io/structurrAI/"
          echo "Checking: $URL"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -L -s -o /tmp/project.html -w '%{http_code}' "$URL")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ] && grep -qi "StructurrAI" /tmp/project.html; then
              echo "Project Pages HTML is live."
              break
            fi
            sleep 10
          done

          if ! grep -qi "StructurrAI" /tmp/project.html; then
            echo "Project Pages HTML verification failed."
            exit 1
          fi

          assets=$(grep -oE '(src|href)="(/structurrAI/[^"]+)"' /tmp/project.html | sed -E 's/^(src|href)="//;s/"$//' | sort -u)
          for asset in $assets; do
            asset_code=$(curl -L -s -o /dev/null -w '%{http_code}' "https://aashishsharma436.github.io$asset")
            echo "Asset $asset -> HTTP $asset_code"
            if [ "$asset_code" != "200" ]; then
              echo "Broken deployed asset: $asset"
              exit 1
            fi
          done

          echo "Project Pages HTML and referenced assets are live."
