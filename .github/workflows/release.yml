name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Pages URL: $PAGES_URL"
          for i in 1 2 3 4 5 6; do
            code=$(curl -L -s -o /tmp/pages.html -w '%{http_code}' "$PAGES_URL")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              grep -qi "StructurrAI" /tmp/pages.html && exit 0
            fi
            sleep 10
          done
          echo "Published URL did not return the expected page."
          exit 1
