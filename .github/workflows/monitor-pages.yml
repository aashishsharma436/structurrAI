name: Monitor Pages Deployment

on:
  workflow_run:
    workflows: ["Build, Release & Deploy"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          if [ -n "${RUN_ID:-}" ]; then
            run=$(gh run view "$RUN_ID" --json status,conclusion,displayTitle,url)
          else
            run=$(gh run list --workflow "Build, Release & Deploy" --limit 1 --json status,conclusion,displayTitle,url --jq '.[0]')
          fi

          echo "$run"

          conclusion=$(echo "$run" | jq -r '.conclusion // ""')
          status=$(echo "$run" | jq -r '.status // ""')
          url=$(echo "$run" | jq -r '.url // ""')
          title=$(echo "$run" | jq -r '.displayTitle // "GitHub Pages deployment"')

          if [ "$conclusion" = "failure" ]; then
            echo "Deployment failure detected."
            gh issue create               --title "GitHub Pages deployment failed"               --body "A GitHub Pages deployment failed.

Workflow: $title
Run: $url

Please inspect the failed run and its logs."               --label "deployment-failure" 2>/dev/null || true
            exit 1
          fi

          if [ "$status" = "in_progress" ]; then
            echo "Deployment is still running."
          else
            echo "Latest deployment status: $conclusion"
          fi
