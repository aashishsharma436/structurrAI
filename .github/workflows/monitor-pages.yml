name: Monitor Pages Deployment

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          if [ -n "${EVENT_RUN_ID:-}" ]; then
            run=$(gh run view "$EVENT_RUN_ID" --json status,conclusion,displayTitle,url)
          else
            run=$(gh run list --workflow "Deploy to GitHub Pages" --limit 1 --json status,conclusion,displayTitle,url --jq '.[0]')
          fi

          echo "$run"
          conclusion=$(echo "$run" | jq -r '.conclusion // ""')

          if [ "$conclusion" = "failure" ]; then
            url=$(echo "$run" | jq -r '.url // ""')
            title=$(echo "$run" | jq -r '.displayTitle // "GitHub Pages deployment"')
            gh issue create               --title "GitHub Pages deployment failed"               --body "Deployment failure detected.

Workflow: $title
Run: $url

Inspect the Actions run for the failed step and logs."               2>/dev/null || true
          fi
